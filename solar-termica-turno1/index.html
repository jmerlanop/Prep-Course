<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuestionario Energía Solar Térmica</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#d8dee9;--accent:#1d4ed8;--good:#16794a;--goodbg:#ecfdf3;--bad:#b42318;--badbg:#fff1f0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.wrap{max-width:960px;margin:auto;padding:14px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(1.2rem,4vw,1.8rem);margin:0}.meta,.legend{font-size:.9rem;color:var(--muted)}.scorebox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--line);padding:9px 11px;border-radius:12px}.scorebig{font-weight:800;font-size:1.1rem}.reset{border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;min-height:44px}.progress{height:8px;background:#e9eef7;border-radius:999px;overflow:hidden;margin-top:9px}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;margin:15px 0;box-shadow:0 6px 20px rgba(16,24,40,.06)}.qhead{display:flex;justify-content:space-between;gap:10px}.qnum{font-weight:800;color:var(--accent)}.pts{font-size:.85rem;color:var(--muted);white-space:nowrap}.stem{font-size:1.04rem;font-weight:650;margin:10px 0 13px}.options{display:grid;gap:9px}.option{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;min-height:48px;font:inherit;color:var(--text)}.option.selected.correct,.option.reveal{border-color:var(--good);background:var(--goodbg)}.option.selected.wrong{border-color:var(--bad);background:var(--badbg)}.option:disabled{opacity:1;cursor:default}.letter{font-weight:800;display:inline-block;min-width:1.6em}.feedback{margin-top:11px;padding:10px 12px;border-radius:10px;font-weight:700}.feedback.good{background:var(--goodbg);color:var(--good)}.feedback.bad{background:var(--badbg);color:var(--bad)}.feedback small{display:block;font-weight:500;margin-top:3px}.done{display:none;background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;text-align:center;margin:20px 0}@media(max-width:560px){.wrap{padding:11px}.card{padding:14px}.scorebox{width:100%;justify-content:space-between}.option{font-size:1rem}}</style></head><body><header><div class="wrap"><div class="top"><div><h1>Energía Solar Térmica — preguntas del turno</h1><div class="meta">40 preguntas · 0,25 puntos c/u · total 10,00 puntos</div></div><div class="scorebox" aria-live="polite"><div><span class="scorebig" id="score">0,00</span> / 10,00</div><div><span id="answered">0</span>/40</div><button class="reset" id="reset" type="button">Reiniciar intento</button></div></div><div class="progress"><div class="bar" id="bar"></div></div></div></header><main class="wrap"><p class="legend">Banco construido únicamente con el material compartido hoy. Marca una opción: verás inmediatamente si fue correcta y el puntaje acumulado.</p><div id="quiz"></div><section class="done" id="done"><h2>Intento terminado</h2><p id="final"></p></section></main><script src="q1.js"></script><script src="q2.js"></script><script src="q3.js"></script><script src="q4.js"></script><script>const Q=window.QUESTIONS||[],quiz=document.getElementById('quiz'),scoreEl=document.getElementById('score'),answeredEl=document.getElementById('answered'),bar=document.getElementById('bar'),done=document.getElementById('done'),finalEl=document.getElementById('final');let score=0,answered=0;const fmt=n=>n.toFixed(2).replace('.',',');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){quiz.innerHTML='';score=0;answered=0;scoreEl.textContent='0,00';answeredEl.textContent='0';bar.style.width='0%';done.style.display='none';Q.forEach(q=>{const c=document.createElement('section');c.className='card';c.innerHTML='<div class="qhead"><div class="qnum">Pregunta '+q.n+'</div><div class="pts">0,25 puntos</div></div><div class="stem"></div><div class="options"></div><div class="feedback" hidden></div>';c.querySelector('.stem').textContent=q.q;const box=c.querySelector('.options');q.o.forEach(([l,t])=>{const b=document.createElement('button');b.type='button';b.className='option';b.dataset.l=l;b.innerHTML='<span class="letter">'+l+'.</span><span></span>';b.lastElementChild.textContent=t;b.addEventListener('click',()=>answer(c,q,l));box.appendChild(b)});quiz.appendChild(c)})}function answer(c,q,l){if(c.dataset.locked)return;c.dataset.locked='1';answered++;const bs=[...c.querySelectorAll('.option')];bs.forEach(b=>b.disabled=true);const chosen=bs.find(b=>b.dataset.l===l),correct=bs.find(b=>b.dataset.l===q.a),ct=q.o.find(x=>x[0]===q.a)[1],fb=c.querySelector('.feedback');fb.hidden=false;if(l===q.a){score+=.25;chosen.classList.add('selected','correct');fb.className='feedback good';fb.innerHTML='✅ Correcto · +0,25 puntos<small>Respuesta: '+q.a+'. '+esc(ct)+'</small>'}else{chosen.classList.add('selected','wrong');correct.classList.add('reveal');fb.className='feedback bad';fb.innerHTML='❌ Incorrecto · +0,00 puntos<small>Respuesta correcta: '+q.a+'. '+esc(ct)+'</small>'}scoreEl.textContent=fmt(score);answeredEl.textContent=answered;bar.style.width=(answered/Q.length*100)+'%';if(answered===Q.length){done.style.display='block';finalEl.textContent='Puntaje final: '+fmt(score)+' / 10,00 ('+(score/10*100).toFixed(1).replace('.',',')+' %).'}}document.getElementById('reset').addEventListener('click',()=>{if(answered&&!confirm('¿Reiniciar todo el intento?'))return;render();scrollTo({top:0,behavior:'smooth'})});render();</script></body></html>
